<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found — Michal Lajčiak</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t === "system") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      if (t === "dark" || t === "light") {
        document.documentElement.setAttribute("data-theme", t);
      }
    })();
  </script>
</head>
<body>
  <div class="site">
    <div class="site-header-bar">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <ol>
          <li><a href="/">Michal Lajčiak</a></li>
          <li aria-current="page">Not found</li>
        </ol>
      </nav>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"><span class="theme-toggle__track"><span class="theme-toggle__thumb"></span></span></button>
    </div>
    <p class="tagline">Page not found.</p>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = "theme";
      var ORDER = ["dark", "light"];
      var LABELS = { dark: "Theme: dark", light: "Theme: light" };
      function resolveTheme(v) {
        if (v === "dark" || v === "light") return v;
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      function getStored() { return resolveTheme(localStorage.getItem(STORAGE_KEY)); }
      function updateFavicon(theme) {
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement("canvas");
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          var ctx = canvas.getContext("2d");
          if (theme === "light") ctx.filter = "invert(1)";
          ctx.drawImage(img, 0, 0);
          var link = document.querySelector("link[rel='icon']");
          if (link) link.href = canvas.toDataURL();
        };
        img.src = "/favicon.png";
      }
      function applyTheme(theme) {
        var r = resolveTheme(theme);
        document.documentElement.setAttribute("data-theme", r);
        var btn = document.getElementById("theme-toggle");
        if (btn) { btn.setAttribute("data-theme-state", r); btn.setAttribute("aria-label", LABELS[r]); }
        updateFavicon(r);
      }
      applyTheme(getStored());
      var btn = document.getElementById("theme-toggle");
      if (btn) {
        btn.addEventListener("click", function () {
          var i = ORDER.indexOf(getStored());
          var next = ORDER[(i + 1) % ORDER.length];
          localStorage.setItem(STORAGE_KEY, next);
          applyTheme(next);
        });
      }
    })();
  </script>
</body>
</html>

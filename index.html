<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michal Lajčiak</title>
  <link rel="icon" type="image/png" href="/public/favicon.png">
  <link rel="preload" href="/public/fonts/osp-din.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "OSP-DIN";
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url("/public/fonts/osp-din.woff2") format("woff2");
    }

    html {
      background: #000;
      color: #000;
      font-family: "OSP-DIN", sans-serif;
      font-size: 112.5%;
      overflow-x: clip;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      margin: 0 auto;
      padding: 0 1.5rem;
      min-height: 100vh;
      max-width: 38rem;
      background: #000;
      color: #000;
      font-family: "OSP-DIN", sans-serif;
      font-weight: 500;
      font-size: 1rem;
      line-height: 1.4;
      text-align: justify;
      text-align-last: left;
      text-wrap: wrap;
      hyphens: auto;
      overflow-wrap: break-word;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #ff0000;
      pointer-events: none;
    }

    body::before { left: 0; }
    body::after { right: 0; }

    @font-face {
      font-family: "Accelerando-8192";
      src: url("/public/fonts/accelerando-8192.ttf") format("truetype");
      font-display: block;
      unicode-range: U+F0000-F1FFF;
    }

    html.machine body,
    html.machine body *:not(.mode-toggle):not(.mode-toggle *) {
      font-family: "Accelerando-8192", "OSP-DIN", sans-serif;
      letter-spacing: 0;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0 -1.5rem 0;
      padding: 0.7rem 1.5rem 0.28rem;
      border: 1px solid #ff0000;
      border-bottom: 0;
      background: #ff0000;
      color: #000;
      font-family: "OSP-DIN", sans-serif;
      font-size: 2.15rem;
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .mode-toggle {
      position: absolute;
      top: 0.4rem;
      right: 0.7rem;
      width: 16px;
      height: 16px;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: #000;
      line-height: 0;
      cursor: pointer;
      z-index: 1;
    }

    .mode-toggle:hover .mode-icon { opacity: 0.7; }

    .mode-toggle::before,
    .mode-toggle::after {
      opacity: 0;
      pointer-events: none;
    }

    .mode-toggle::before {
      content: "";
      position: absolute;
      top: calc(100% + 3px);
      left: 50%;
      transform: translateX(-50%);
      border-style: solid;
      border-width: 0 5px 6px 5px;
      border-color: transparent transparent #000 transparent;
    }

    .mode-toggle::after {
      content: attr(aria-label);
      position: absolute;
      top: calc(100% + 9px);
      right: -0.2rem;
      padding: 0.14rem 0.42rem;
      background: #000;
      color: #ff0000;
      font-family: "OSP-DIN", sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .mode-toggle:hover::before,
    .mode-toggle:focus-visible::before,
    .mode-toggle:hover::after,
    .mode-toggle:focus-visible::after {
      opacity: 1;
    }

    .mode-toggle:focus-visible {
      outline: 2px solid #000;
      outline-offset: 3px;
    }

    .mode-toggle .mode-icon {
      display: block;
      width: 16px;
      height: 16px;
    }

    .mode-toggle .mode-icon-acc { display: none; }

    html.machine .mode-toggle .mode-icon-latin { display: none; }

    html.machine .mode-toggle .mode-icon-acc { display: block; }

    .copy {
      position: relative;
      margin: 0 -1.5rem;
      padding: 0.7rem 1.5rem;
      border: 1px solid #ff0000;
      background: #000;
      color: #ff0000;
    }

    .work {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 -1.5rem;
      padding: 0.7rem 1.5rem;
      border-right: 1px solid #ff0000;
      border-left: 1px solid #ff0000;
      background: #000;
      color: #ff0000;
      text-align: center;
      text-align-last: center;
    }

    .work p {
      margin: 0;
    }

    p {
      margin: 0 0 1rem;
      font-family: "OSP-DIN", sans-serif;
      font-size: 1rem;
      font-weight: 500;
    }

    p:last-child {
      margin-bottom: 0;
    }

    a,
    a:visited {
      color: #ff0000;
      text-decoration: none;
    }

    a:hover,
    a:visited:hover,
    a:focus-visible {
      background: #ff0000;
      color: #000;
    }

  </style>
</head>
<body>
  <h1>Michal Lajčiak
    <button class="mode-toggle" type="button" aria-pressed="false" aria-label="Switch to Accelerando">
      <svg class="mode-icon mode-icon-latin" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.15 13.15 8 2.35l4.85 10.8M5.05 9.2h5.9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      <svg class="mode-icon mode-icon-acc" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 2.6h7.2v7.2H2.6zM6.2 6.2h7.2v7.2H6.2z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
  </h1>
  <div class="copy">
    <p>I am the founder of <a href="https://xyzt-lab.com">XYZT</a>, which works on photonic supercomputers.</p>
    <p>I am 20 and I was born in Slovakia. My interests are compute, applied physics, robots and hardware, superintelligence, and futurism.</p>
    <p>Connect with me on <a href="https://x.com/lajciakmichal">X</a>.</p>
  </div>
  <section class="work" aria-label="Work and blog">
    <p>NOTHING TO SEE HERE YET</p>
  </section>
  <script src="/js/machine.js"></script>
</body>
</html>

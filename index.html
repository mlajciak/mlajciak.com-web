<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michal Lajčiak</title>
  <link rel="icon" type="image/png" href="/public/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&display=swap">
  <style>
    html {
      background: #00ff41;
      color: #000;
      font-family: "Roboto Condensed";
      overflow-x: clip;
    }

    body {
      position: relative;
      box-sizing: border-box;
      margin: 0 auto;
      padding: 2.4rem 1.5rem 4rem;
      min-height: 100vh;
      max-width: 38rem;
      background: #00ff41;
      color: #000;
      font-family: "Roboto Condensed";
      font-weight: 900;
      font-size: 1rem;
      line-height: 1.4;
      text-align: justify;
      text-align-last: left;
      text-wrap: wrap;
      hyphens: auto;
      overflow-wrap: break-word;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #000;
      pointer-events: none;
    }

    body::before { left: 0; }
    body::after { right: 0; }

    @font-face {
      font-family: "Accelerando-8192";
      src: url("/public/fonts/accelerando-8192.ttf") format("truetype");
      font-display: swap;
      unicode-range: U+F0000-F1FFF;
    }

    html.machine h1,
    html.machine .copy,
    html.machine .copy * {
      font-family: "Accelerando-8192", "Roboto Condensed";
      letter-spacing: 0;
    }

    h1 {
      position: relative;
      margin: 0 -1.5rem 0;
      padding: 0.45rem 1.5rem 0.5rem;
      border: 2px solid #000;
      border-bottom: 0;
      background: #000;
      color: #fff;
      font-size: 2.75rem;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .mode-toggle {
      position: absolute;
      top: 0.4rem;
      right: 0.7rem;
      width: 16px;
      height: 16px;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: #fff;
      line-height: 0;
      cursor: pointer;
    }

    .mode-toggle:hover { opacity: 0.7; }

    .mode-toggle:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .mode-toggle .mode-icon {
      display: block;
      width: 16px;
      height: 16px;
    }

    .mode-toggle .mode-icon-acc { display: none; }

    html.machine .mode-toggle .mode-icon-latin { display: none; }

    html.machine .mode-toggle .mode-icon-acc { display: block; }

    .copy {
      position: relative;
      margin: 0 -1.5rem;
      padding: 0.7rem 1.5rem;
      border: 2px solid #000;
      background: #fff;
    }

    h1::before,
    .copy::before,
    .copy::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 100vw;
      height: 2px;
      margin-left: -50vw;
      background: #000;
      pointer-events: none;
    }

    h1::before,
    .copy::before { top: -2px; }

    .copy::after { bottom: -2px; }

    p {
      margin: 0 0 1rem;
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    p:last-child {
      margin-bottom: 0;
    }

    a,
    a:visited {
      color: #000;
    }

  </style>
</head>
<body>
  <h1>Michal Lajčiak
    <button class="mode-toggle" type="button" aria-pressed="false" aria-label="Switch to Accelerando">
      <svg class="mode-icon mode-icon-latin" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.15 13.15 8 2.35l4.85 10.8M5.05 9.2h5.9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      <svg class="mode-icon mode-icon-acc" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 2.6h7.2v7.2H2.6zM6.2 6.2h7.2v7.2H6.2z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
  </h1>
  <div class="copy">
    <p>I am the founder of <a href="https://xyzt-lab.com">XYZT</a>, which works on photonic supercomputers.</p>
    <p>I am 20 and I was born in Slovakia. My interests are compute, applied physics, robots and hardware, superintelligence, and futurism.</p>
    <p>Connect with me on <a href="https://x.com/lajciakmichal">X</a>.</p>
  </div>
  <script src="/js/machine.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <style>
    header {
      position: sticky;
      top: 0;
      padding: 1rem 1rem 1.5rem;
      margin: -2rem -1rem 1rem;
      background: linear-gradient(to bottom, white 0%, white 60%, rgba(255,255,255,0.85) 80%, rgba(255,255,255,0.5) 92%, transparent 100%);
      z-index: 100;
    }

    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1.25rem;
    }

    .breadcrumb {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }

    .breadcrumb a {
      font-weight: bold;
    }

    header a {
      transition: none;
    }

    header a:hover {
      opacity: 0.5;
    }

    /* Font toggle button */
    #font-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      color: #333;
      transition: none;
    }

    #font-toggle:hover {
      opacity: 0.5;
    }

    #font-icon {
      display: block;
      font-size: 1.4rem;
      line-height: 1;
      font-weight: 500;
    }

    body.dark #font-toggle {
      color: #eee;
    }

    /* Theme toggle button */
    #theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      color: #333;
      transition: none;
    }

    #theme-toggle:hover {
      opacity: 0.5;
    }

    #theme-toggle svg {
      width: 1.2rem;
      height: 1.2rem;
    }

    /* Article */
    article {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    article h1 { font-size: 1.25rem; margin: 2.5rem 0 0.75rem; }
    article h2 { margin-top: 2.5rem; }
    article h3 { margin-top: 2.5rem; }
    article h4 { margin-top: 2.5rem; }
    article h5 { margin-top: 2.5rem; }
    article h6 { margin-top: 2.5rem; }
    article p { margin-bottom: 1rem; }
    article ul { margin-bottom: 1rem; padding-left: 1.5rem; }
    article li { margin-bottom: 0.25rem; }
    article img {
      max-width: 40%;
      height: auto;
      display: block;
      margin: 2rem auto 0;
      border-radius: 8px;
      border: 1px solid currentColor;
      float: right;
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }

    article h1,
    article h2,
    article h3,
    article h4,
    article h5,
    article h6 {
      clear: both;
    }

    article code {
      background: #f5f5f5;
      padding: 0.125rem 0.375rem;
      border-radius: 3px;
      font-size: 0.875rem;
    }

    article pre {
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 1rem;
    }

    article pre code { background: none; padding: 0; }

    article blockquote {
      border-left: 2px solid #ccc;
      padding-left: 1rem;
      margin-bottom: 1rem;
      color: #666;
      font-style: italic;
    }

    /* Dark mode - page specific */
    body.dark header {
      background: linear-gradient(to bottom, #1a1a1a 0%, #1a1a1a 60%, rgba(26,26,26,0.85) 80%, rgba(26,26,26,0.5) 92%, transparent 100%);
    }

    body.dark article code,
    body.dark article pre {
      background: #1a1a1a;
      color: #eee;
    }

    body.dark article blockquote {
      border-color: #444;
      color: #888;
    }

    /* Math rendering styles - use proper math fonts for each style */
    article .katex {
      font-size: 1em;
    }

    /* Serif (default): Use KaTeX's built-in math fonts (Computer Modern) */
    #content[style*="Georgia"] .katex,
    #content[style*="serif"] .katex {
      /* KaTeX default fonts are already serif-appropriate */
    }

    /* Sans-serif: Use KaTeX sans-serif math variant */
    #content[style*="system-ui"] .katex,
    #content[style*="sans-serif"] .katex {
      font-family: KaTeX_SansSerif, sans-serif !important;
    }

    #content[style*="system-ui"] .katex .mathnormal,
    #content[style*="sans-serif"] .katex .mathnormal {
      font-family: KaTeX_SansSerif, sans-serif !important;
    }

    /* Monospace: Use KaTeX typewriter math variant */
    #content[style*="JetBrains"] .katex,
    #content[style*="monospace"] .katex {
      font-family: KaTeX_Typewriter, 'JetBrains Mono', monospace !important;
    }

    #content[style*="JetBrains"] .katex .mathnormal,
    #content[style*="monospace"] .katex .mathnormal {
      font-family: KaTeX_Typewriter, 'JetBrains Mono', monospace !important;
    }

    /* Adjust math spacing for better readability */
    article .katex-display {
      margin: 1.5rem 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    /* Dark mode math */
    body.dark article .katex {
      color: #eee;
    }

    /* Books page - fade italic text */
    body.books-page article em {
      opacity: 0.6;
    }

    /* Keep article text justified on mobile */
    @media (max-width: 768px) {
      article p {
        text-align: justify;
      }
    }
  </style>
</head>
<body>
  <script>
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
  </script>
  <header>
    <div class="header-inner">
      <div class="breadcrumb">
        <a href="index.html">Michal Lajčiak</a>
        <span>/</span>
        <span id="post-title">Post</span>
      </div>
      <div class="badges">
        <button id="font-toggle" aria-label="Toggle article font">
          <span id="font-icon">F</span>
        </button>
        <button id="theme-toggle" aria-label="Toggle dark mode">
          <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="5.64" y1="5.64" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="18.36" y2="18.36"/><line x1="5.64" y1="18.36" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="18.36" y2="5.64"/></svg>
          <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a class="badge" href="https://x.com/lajciakmichal" target="_blank" rel="noopener noreferrer" aria-label="X profile">
          <img src="x.png" alt="X">
        </a>
        <a class="badge badge-square" href="https://huggingface.co/mlajciak" target="_blank" rel="noopener noreferrer" aria-label="Hugging Face profile">
          <img src="hf.png" alt="Hugging Face">
        </a>
      </div>
    </div>
  </header>
  <main>
    <article id="content"></article>
  </main>
  <script>
    const fontFamilies = [
      { label: 'mono',  family: "'JetBrains Mono', monospace" },
      { label: 'serif', family: "Georgia, 'Times New Roman', serif" },
      { label: 'sans',  family: "system-ui, -apple-system, sans-serif" },
    ];
    const fontIcon = document.getElementById('font-icon');
    const savedFontIndex = parseInt(localStorage.getItem('font') || '0', 10);
    let fontIndex = savedFontIndex;

    function applyArticleFont(index) {
      const f = fontFamilies[index];
      const article = document.getElementById('content');
      if (article) article.style.fontFamily = f.family;
      fontIcon.style.fontFamily = f.family;
    }

    applyArticleFont(fontIndex);

    document.getElementById('font-toggle').addEventListener('click', () => {
      fontIndex = (fontIndex + 1) % fontFamilies.length;
      localStorage.setItem('font', fontIndex.toString());
      applyArticleFont(fontIndex);
    });

    const toggle = document.getElementById('theme-toggle');
    const iconSun = document.getElementById('icon-sun');
    const iconMoon = document.getElementById('icon-moon');

    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
      iconSun.style.display = dark ? 'none' : 'block';
      iconMoon.style.display = dark ? 'block' : 'none';
    }

    applyTheme(localStorage.getItem('theme') === 'dark');

    toggle.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      applyTheme(isDark);
    });

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    if (slug) {
      fetch('blog/posts.json')
        .then(r => r.json())
        .then(posts => {
          const post = posts.find(p => p.slug === slug);
          if (post) {
            document.getElementById('post-title').textContent = post.title;
            document.title = post.title + ' — Michal Lajčiak';
            if (slug === 'books') document.body.classList.add('books-page');
            return fetch('blog/' + post.file);
          }
        })
        .then(r => r.text())
        .then(md => {
          marked.setOptions({ breaks: true });
          document.getElementById('content').innerHTML = marked.parse(md);
          // Render math with KaTeX
          renderMathInElement(document.getElementById('content'), {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\[', right: '\\]', display: true},
              {left: '\\(', right: '\\)', display: false}
            ],
            throwOnError: false,
            trust: true
          });
          // Execute any scripts in the parsed content
          document.getElementById('content').querySelectorAll('script').forEach(oldScript => {
            const newScript = document.createElement('script');
            newScript.textContent = oldScript.textContent;
            oldScript.parentNode.replaceChild(newScript, oldScript);
          });
        });
    }

    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      orientation: 'vertical',
      smoothWheel: true,
    });

    function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.png" type="image/png">
  <title>Writing — Michal Lajčiak</title>
  <link rel="stylesheet" href="/css/site.css">
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t === "system") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      if (t === "dark" || t === "light") {
        document.documentElement.setAttribute("data-theme", t);
      }
    })();
  </script>
</head>
<body>
  <div class="site">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li><a href="/">Michal Lajčiak</a></li>
        <li aria-current="page">Writing</li>
      </ol>
    </nav>

    <section>
      <ul class="post-list">
        <li>
          <a href="/writing/transformer_architecture/">
            <div class="post-title">Brief Overview of Transformer</div>
            <div class="post-meta">March 2, 2026</div>
          </a>
        </li>
      </ul>
    </section>
  </div>
  <script src="/js/theme.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // Redirect to index.html with the path encoded as a query param
    var path = window.location.pathname;
    window.location.replace(
      window.location.origin + '/?p=' + encodeURIComponent(path)
    );
  </script>
</head>
<body></body>
</html>

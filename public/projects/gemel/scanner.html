<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMEL</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0f1115;
            color: #c4cdd6;
            overflow: hidden;
            height: 100vh;
        }

        .shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 14px 16px 16px;
            gap: 12px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .masthead {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            padding-bottom: 4px;
            border-bottom: 1px solid #262b33;
        }

        .masthead-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wordmark {
            font-family: 'Orbitron', monospace;
            font-size: clamp(1.1rem, 2.8vw, 1.45rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #e8edf4;
        }

        .byline {
            font-size: 0.75rem;
            font-weight: 500;
            color: #6b7380;
            letter-spacing: 0.02em;
        }

        .split {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            min-height: 0;
        }

        .gemel-cam,
        .gemel-view {
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .frame {
            position: relative;
            flex: 1;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            overflow: hidden;
            background: #07080a;
            border: 1px solid #2a3038;
        }

        .frame--cam .video-feed {
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        .frame--view #loading,
        .frame--view #viewer {
            position: absolute;
            inset: 0;
        }

        .frame--view #viewer canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .frame--view {
            border-color: #2a3038;
        }

        .frame-flash {
            animation: frameFlash 0.35s ease-out;
        }

        @keyframes frameFlash {
            50% {
                border-color: #4a5568;
                box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.2);
            }
        }

        .view-label {
            position: absolute;
            top: 8px;
            left: 10px;
            z-index: 2;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #6b7280;
            pointer-events: none;
        }

        .video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
            display: block;
        }

        .canvas-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hud-badge {
            position: absolute;
            z-index: 3;
            padding: 4px 9px;
            border-radius: 4px;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            pointer-events: none;
            border: 1px solid #3d4654;
            background: rgba(20, 22, 28, 0.9);
        }

        .hud-badge--ok {
            bottom: 10px;
            left: 10px;
            color: #a7d4aa;
            border-color: #3d5240;
            background: rgba(24, 32, 28, 0.92);
        }

        .hud-badge--warn {
            bottom: 10px;
            left: 10px;
            color: #d4c4a0;
            border-color: #4a4538;
            background: rgba(32, 30, 24, 0.92);
        }

        .scanning-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background: rgba(15, 17, 21, 0.4);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 160px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #7a8494;
            letter-spacing: 0.04em;
        }

        .loading::after {
            content: '';
            width: 18px;
            height: 18px;
            margin-left: 10px;
            border: 2px solid #2e3540;
            border-top-color: #64748b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .dock {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-start;
            gap: 10px 14px;
            padding-top: 8px;
            border-top: 1px solid #262b33;
        }

        .dock-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
        }

        .btn {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn-primary {
            padding: 9px 18px;
            font-size: 0.88rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #f8fafc;
            background: #334155;
            border: 1px solid #475569;
        }

        .btn-primary:hover:not(:disabled) {
            background: #3f4f66;
            border-color: #64748b;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary.scanning {
            background: #854d0e;
            border-color: #a16207;
            color: #fefce8;
        }

        .btn-primary.completed {
            background: #166534;
            border-color: #15803d;
            color: #ecfdf5;
        }

        .btn-quiet {
            padding: 6px 4px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #7a8494;
            background: transparent;
            border: none;
        }

        .btn-quiet:hover {
            color: #c4cdd6;
        }

        @media (max-width: 768px) {
            .shell {
                padding: 10px;
            }

            .split {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }

            .dock-actions {
                justify-content: center;
                width: 100%;
            }

            .btn-primary {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="masthead">
            <div class="masthead-brand">
                <span class="wordmark">GEMEL</span>
            </div>
            <span class="byline">Made by Michal Lajčiak</span>
        </header>

        <main class="split">
            <section class="gemel-cam">
                <div class="frame frame--cam">
                    <video id="video" class="video-feed" autoplay muted playsinline webkit-playsinline></video>
                    <canvas id="canvas" class="canvas-overlay"></canvas>
                    <div id="scanningOverlay" class="scanning-overlay" style="display: none;"></div>
                    <div id="faceDetected" class="hud-badge hud-badge--warn" style="display: none;">Align your face</div>
                </div>
            </section>
            <section class="gemel-view">
                <div class="frame frame--view">
                    <span class="view-label">Preview</span>
                    <div id="loading" class="loading">Loading viewer</div>
                    <div id="viewer" style="width: 100%; height: 100%; display: none;"></div>
                </div>
            </section>
        </main>

        <footer class="dock">
            <div class="dock-actions">
                <button type="button" id="mainBtn" class="btn btn-primary">Start camera</button>
                <button type="button" id="resetBtn" class="btn btn-quiet">Reset</button>
                <button type="button" id="backBtn" class="btn btn-quiet">Home</button>
            </div>
        </footer>
    </div>

    <script>

        class FaceScanner {
            constructor() {
                this.video = document.getElementById('video');
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.mainBtn = document.getElementById('mainBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.faceDetected = document.getElementById('faceDetected');
                this.loading = document.getElementById('loading');
                this.viewer = document.getElementById('viewer');
                this.scanningOverlay = document.getElementById('scanningOverlay');
                
                this.faceMesh = null;
                this.camera = null;
                this.scene = null;
                this.renderer = null;
                this.controls = null;
                this.vhsModel = null;
                this.isScanning = false;
                this.faceResults = null;
                this.frameCount = 0;
                this.faceDetectedTimeout = null;
                this.shouldUpdateCanvas = false;

                this.capturePositions = [
                    { name: 'front', description: 'Look straight at the camera', angleCheck: this.isFacingFront.bind(this) },
                    { name: 'left', description: 'Turn your head left', angleCheck: this.isFacingLeft.bind(this) },
                    { name: 'right', description: 'Turn your head right', angleCheck: this.isFacingRight.bind(this) },
                    { name: 'up', description: 'Tilt your head up', angleCheck: this.isFacingUp.bind(this) },
                    { name: 'down', description: 'Tilt your head down', angleCheck: this.isFacingDown.bind(this) }
                ];
                this.currentPositionIndex = 0;
                this.capturedImages = {};
                this.triangulationIndices = null;
                this.faceTexture = null;
                
                this.init();
            }
            
            async loadTriangulation() {
                if (this.triangulationIndices) return;
                const res = await fetch('triangulation.json');
                if (!res.ok) throw new Error('Failed to load face triangulation');
                this.triangulationIndices = await res.json();
            }
            
            async init() {
                await this.setupMediaPipe();
                await this.setup3DViewer();
                await this.loadTriangulation();
                this.setupEventListeners();
                
                setTimeout(() => {
                    this.loading.style.display = 'none';
                    this.viewer.style.display = 'block';
                    
                    console.log('3D viewer should now be visible');
                    
                    this.resizeRenderer();
                }, 500);
            }
            
            async setupMediaPipe() {
                this.faceMesh = new FaceMesh({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
                    }
                });
                
                this.faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: false,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                
                this.faceMesh.onResults(this.onFaceResults.bind(this));
            }
            
            async setup3DViewer() {
                try {
                    console.log('Setting up 3D viewer...');
                    
                    if (typeof THREE === 'undefined') {
                        throw new Error('Three.js not loaded');
                    }
                    
                    const container = this.viewer;
                    console.log('Container dimensions:', container.clientWidth, 'x', container.clientHeight);
                    
                    this.scene = new THREE.Scene();
                    this.scene.background = new THREE.Color(0x111111);
                    console.log('Scene created');
                    
                    const width = container.clientWidth || 400;
                    const height = container.clientHeight || 400;
                    
                    this.camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
                    this.camera.position.set(0, 0, 5);
                    console.log('Camera created');
                    
                    this.renderer = new THREE.WebGLRenderer({ 
                        antialias: true,
                        alpha: true
                    });
                    this.renderer.setSize(width, height);
                    this.renderer.setPixelRatio(window.devicePixelRatio);
                    this.renderer.setClearColor(0x000000, 1);
                    container.appendChild(this.renderer.domElement);
                    console.log('Renderer created and added to container');
                    
                    const testGeometry = new THREE.BoxGeometry(1, 1, 1);
                    const testMaterial = new THREE.MeshBasicMaterial({ 
                        color: 0x475569,
                        wireframe: true
                    });
                    this.testCube = new THREE.Mesh(testGeometry, testMaterial);
                    this.scene.add(this.testCube);
                    console.log('Test cube added');
                    
                    this.setupMouseControls();
                    console.log('Simple Y-axis rotation controls enabled');
                    
                    const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
                    this.scene.add(ambientLight);
                    
                    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.85);
                    directionalLight.position.set(5, 8, 6);
                    this.scene.add(directionalLight);
                    
                    const directionalLight2 = new THREE.DirectionalLight(0xaaccff, 0.45);
                    directionalLight2.position.set(-6, -2, 4);
                    this.scene.add(directionalLight2);
                    console.log('Lighting added');
                    
                    const animate = () => {
                        requestAnimationFrame(animate);
                        
                        if (this.updateRotation) {
                            this.updateRotation();
                        }
                        
                        this.renderer.render(this.scene, this.camera);
                    };
                    animate();
                    console.log('Animation loop started');
                    
                    window.addEventListener('resize', () => {
                        this.resizeRenderer();
                    });
                    
                    console.log('3D viewer setup complete');
                    
                } catch (error) {
                    console.error('Error setting up 3D viewer:', error);
                    this.loading.innerHTML = `<div style="color: #ff0000;">3D Viewer Error: ${error.message}</div>`;
                }
            }
            
            setupMouseControls() {
                const canvas = this.renderer.domElement;
                let isMouseDown = false;
                let mouseX = 0;
                let targetRotationY = 0;
                let currentRotationY = 0;
                canvas.addEventListener('mousedown', (event) => {
                    isMouseDown = true;
                    mouseX = event.clientX;
                });
                
                canvas.addEventListener('mousemove', (event) => {
                    if (!isMouseDown) return;
                    
                    const deltaX = event.clientX - mouseX;
                    targetRotationY += deltaX * 0.01;
                    mouseX = event.clientX;
                });
                
                canvas.addEventListener('mouseup', () => {
                    isMouseDown = false;
                });
                
                canvas.addEventListener('mouseleave', () => {
                    isMouseDown = false;
                });
                
                canvas.addEventListener('touchstart', (event) => {
                    if (event.touches.length === 1) {
                        isMouseDown = true;
                        mouseX = event.touches[0].clientX;
                    }
                });
                
                canvas.addEventListener('touchmove', (event) => {
                    if (!isMouseDown || event.touches.length !== 1) return;
                    event.preventDefault();
                    
                    const deltaX = event.touches[0].clientX - mouseX;
                    targetRotationY += deltaX * 0.01;
                    mouseX = event.touches[0].clientX;
                });
                
                canvas.addEventListener('touchend', () => {
                    isMouseDown = false;
                });
                
                canvas.addEventListener('wheel', (event) => {
                    event.preventDefault();
                    const zoomSpeed = 0.1;
                    const newZ = this.camera.position.z + (event.deltaY > 0 ? zoomSpeed : -zoomSpeed);
                    this.camera.position.z = Math.max(2, Math.min(15, newZ));
                });
                
                this.updateRotation = () => {
                    currentRotationY += (targetRotationY - currentRotationY) * 0.1;
                    
                    if (this.testCube) {
                        this.testCube.rotation.y = currentRotationY;
                    }
                    if (this.faceModel) {
                        this.faceModel.rotation.y = currentRotationY;
                    }
                    if (this.wireframe) {
                        this.wireframe.rotation.y = currentRotationY;
                    }
                };
            }

            resizeRenderer() {
                if (this.renderer && this.camera) {
                    const container = this.viewer;
                    let width = container.clientWidth;
                    let height = container.clientHeight;
                    
                    if (width === 0 || height === 0) {
                        width = container.offsetWidth || 400;
                        height = container.offsetHeight || 400;
                        console.warn('Container has zero dimensions, using fallback:', width, 'x', height);
                    }
                    
                    console.log('Resizing renderer to:', width, 'x', height);
                    
                    this.camera.aspect = width / height;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(width, height);
                    
                    this.renderer.render(this.scene, this.camera);
                    
                    if (width <= 100 || height <= 100) {
                        setTimeout(() => {
                            const newWidth = container.clientWidth || container.offsetWidth;
                            const newHeight = container.clientHeight || container.offsetHeight;
                            if (newWidth > width || newHeight > height) {
                                console.log('Retrying resize with better dimensions:', newWidth, 'x', newHeight);
                                this.camera.aspect = newWidth / newHeight;
                                this.camera.updateProjectionMatrix();
                                this.renderer.setSize(newWidth, newHeight);
                                this.renderer.render(this.scene, this.camera);
                            }
                        }, 100);
                    }
                }
            }
            
                                     setupEventListeners() {
                this.mainBtn.addEventListener('click', this.handleMainAction.bind(this));
                this.resetBtn.addEventListener('click', this.reset.bind(this));
                document.getElementById('backBtn').addEventListener('click', this.goBack.bind(this));
                        }

            handleMainAction() {
                if (!this.video.srcObject) {
                    this.startCamera();
                } else {
                    this.scanFace();
                }
            }
            
            goBack() {
                try {
                    if (window.top !== window.self) {
                        window.top.location.assign('/');
                    } else {
                        window.location.assign('/');
                    }
                } catch (e) {
                    window.location.assign('/');
                }
            }
            
            async startCamera() {
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        throw new Error('Camera not supported by this browser');
                    }
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            width: { ideal: 640 }, 
                            height: { ideal: 480 },
                            facingMode: 'user'
                        } 
                    });
                    
                    this.video.srcObject = stream;
                    
                    await new Promise((resolve) => {
                        this.video.addEventListener('loadedmetadata', resolve, { once: true });
                    });
                    
                    console.log('Video dimensions:', this.video.videoWidth, 'x', this.video.videoHeight);
                    console.log('Stream tracks:', stream.getTracks().length);
                    
                    this.canvas.width = this.video.videoWidth || 640;
                    this.canvas.height = this.video.videoHeight || 480;
                    
                    try {
                        await this.video.play();
                        console.log('Video is now playing');
                    } catch (playError) {
                        console.warn('Video play failed:', playError);
                    }
                    
                    this.startFrameProcessing();
                    
                    this.mainBtn.textContent = 'Scan';
                    
                    setTimeout(() => {
                        if (this.video.readyState >= 2) {
                            console.log('Video has data and is ready');
                        } else {
                            console.warn('Video not ready:', this.video.readyState);
                        }
                    }, 1000);
                    
                } catch (error) {
                    console.error('Error accessing camera:', error);
                    let errorMessage = 'Could not access the camera.';
                    
                    if (error.name === 'NotAllowedError') {
                        errorMessage = 'Camera access was denied. Allow the camera and try again.';
                    } else if (error.name === 'NotFoundError') {
                        errorMessage = 'No camera was found.';
                    } else if (error.name === 'NotSupportedError') {
                        errorMessage = 'Camera is not supported in this browser.';
                    }
                    
                    alert(errorMessage);
                }
            }
            
            startFrameProcessing() {
                const processFrame = async () => {
                    if (!this.video.srcObject) return;
                    
                    if (!this.frameCount) this.frameCount = 0;
                    this.frameCount++;
                    
                    if (this.frameCount % 10 === 0) {
                        this.shouldUpdateCanvas = true;
                        try {
                            await this.faceMesh.send({ image: this.video });
                        } catch (error) {
                            console.error('Face detection error:', error);
                        }
                    }
                    
                    requestAnimationFrame(processFrame);
                };
                
                requestAnimationFrame(processFrame);
            }
            
            isFacingFront(landmarks) {
                const nose = landmarks[1];
                const leftCheek = landmarks[234];
                const rightCheek = landmarks[454];
                
                const faceWidth = Math.abs(leftCheek.x - rightCheek.x);
                const noseOffset = Math.abs(nose.x - (leftCheek.x + rightCheek.x) / 2);
                
                return noseOffset < faceWidth * 0.1;
            }

            isFacingLeft(landmarks) {
                const nose = landmarks[1];
                const leftCheek = landmarks[234];
                const rightCheek = landmarks[454];
                
                return (nose.x - rightCheek.x) > (leftCheek.x - rightCheek.x) * 0.3;
            }

            isFacingRight(landmarks) {
                const nose = landmarks[1];
                const leftCheek = landmarks[234];
                const rightCheek = landmarks[454];
                
                return (leftCheek.x - nose.x) > (leftCheek.x - rightCheek.x) * 0.3;
            }

            isFacingUp(landmarks) {
                const nose = landmarks[1];
                const chin = landmarks[152];
                const forehead = landmarks[10];
                
                return (nose.y - chin.y) > (forehead.y - chin.y) * 0.6;
            }

            isFacingDown(landmarks) {
                const nose = landmarks[1];
                const chin = landmarks[152];
                const forehead = landmarks[10];
                
                return (chin.y - nose.y) > (chin.y - forehead.y) * 0.6;
            }

            async loadVHSModel() {
                return new Promise((resolve, reject) => {
                    const loader = new THREE.GLTFLoader();
                    loader.load(
                        '/resources/vhs.glb',
                        (gltf) => {
                            this.vhsModel = gltf.scene;
                            this.scene.add(this.vhsModel);
                            resolve();
                        },
                        undefined,
                        reject
                    );
                });
            }

            captureCurrentPosition() {
                const captureCanvas = document.createElement('canvas');
                captureCanvas.width = this.video.videoWidth;
                captureCanvas.height = this.video.videoHeight;
                const ctx = captureCanvas.getContext('2d');
                ctx.drawImage(this.video, 0, 0);
                
                const currentPosition = this.capturePositions[this.currentPositionIndex];
                this.capturedImages[currentPosition.name] = captureCanvas.toDataURL('image/jpeg');
                
                this.currentPositionIndex++;
                if (this.currentPositionIndex < this.capturePositions.length) {
                    this.updatePositionGuidance();
                } else {
                    this.processImages();
                }
            }

            updatePositionGuidance() {
                this.mainBtn.textContent = 'Capture';
                this.mainBtn.disabled = true;
            }

            async processImages() {
                this.mainBtn.disabled = true;
                
                const textureCanvas = document.createElement('canvas');
                textureCanvas.width = 1024;
                textureCanvas.height = 1024;
                const ctx = textureCanvas.getContext('2d');
                
                let y = 0;
                for (const [position, imageData] of Object.entries(this.capturedImages)) {
                    const img = new Image();
                    await new Promise(resolve => {
                        img.onload = resolve;
                        img.src = imageData;
                    });
                    ctx.drawImage(img, 0, y, 1024, 1024/5);
                    y += 1024/5;
                }
                
                const texture = new THREE.CanvasTexture(textureCanvas);
                
                if (this.vhsModel) {
                    this.vhsModel.traverse((child) => {
                        if (child.isMesh) {
                            child.material.map = texture;
                            child.material.needsUpdate = true;
                        }
                    });
                }
                
                this.mainBtn.textContent = 'Scan Complete';
                this.mainBtn.classList.add('completed');
            }

            onFaceResults(results) {
                if (!this.shouldUpdateCanvas) return;
                this.shouldUpdateCanvas = false;
                
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    clearTimeout(this.faceDetectedTimeout);
                    this.faceDetected.style.display = 'block';
                    this.faceResults = results;
                    
                    const currentPosition = this.capturePositions[this.currentPositionIndex];
                    if (currentPosition && currentPosition.angleCheck(results.multiFaceLandmarks[0])) {
                        this.mainBtn.disabled = false;
                        this.faceDetected.textContent = 'Ready';
                        this.faceDetected.className = 'hud-badge hud-badge--ok';
                    } else {
                        this.mainBtn.disabled = true;
                        this.faceDetected.textContent = 'Adjust';
                        this.faceDetected.className = 'hud-badge hud-badge--warn';
                    }
                    
                    for (const landmarks of results.multiFaceLandmarks) {
                        drawConnectors(this.ctx, landmarks, FACEMESH_TESSELATION, {
                            color: '#5b7a8c',
                            lineWidth: 0.3
                        });
                        
                        drawConnectors(this.ctx, landmarks, FACEMESH_RIGHT_EYE, {
                            color: '#7d6b94',
                            lineWidth: 0.8
                        });
                        
                        drawConnectors(this.ctx, landmarks, FACEMESH_LEFT_EYE, {
                            color: '#7d6b94',
                            lineWidth: 0.8
                        });
                        
                        drawConnectors(this.ctx, landmarks, FACEMESH_LIPS, {
                            color: '#8a8260',
                            lineWidth: 0.8
                        });
                    }
                } else {
                    this.faceDetectedTimeout = setTimeout(() => {
                        this.faceDetected.style.display = 'none';
                        this.faceResults = null;
                    }, 1000);
                }
            }
            
            scanFace() {
                if (!this.faceResults) {
                    return;
                }
                
                this.isScanning = true;
                this.mainBtn.disabled = true;
                this.mainBtn.classList.add('scanning');
                this.mainBtn.textContent = 'Scanning…';
                
                this.scanningOverlay.style.display = 'block';
                
                let countdown = 3;
                const updateCountdown = () => {
                    if (countdown > 0) {
                        this.createBeepEffect();
                        
                        countdown--;
                        setTimeout(updateCountdown, 1000);
                    } else {
                        setTimeout(() => {
                            setTimeout(() => {
                                void this.create3DModelWithEffect();
                                this.isScanning = false;
                                this.mainBtn.disabled = false;
                                this.mainBtn.classList.remove('scanning');
                                this.mainBtn.classList.add('completed');
                                this.mainBtn.textContent = 'Done';
                                
                                this.scanningOverlay.style.display = 'none';
                            }, 800);
                        }, 500);
                    }
                };
                updateCountdown();
            }
            
            async create3DModelWithEffect() {
                console.log('Creating 3D face model with dramatic effect...');
                
                const flash = document.createElement('div');
                flash.style.position = 'absolute';
                flash.style.top = '0';
                flash.style.left = '0';
                flash.style.width = '100%';
                flash.style.height = '100%';
                flash.style.background = 'rgba(255, 255, 255, 0.12)';
                flash.style.zIndex = '5';
                flash.style.opacity = '1';
                this.viewer.appendChild(flash);
                
                flash.animate([
                    { opacity: '1' },
                    { opacity: '0' }
                ], {
                    duration: 300,
                    easing: 'ease-out'
                }).onfinish = () => {
                    flash.remove();
                };
                
                await new Promise((r) => setTimeout(r, 150));
                await this.create3DModel();
            }

            async create3DModel() {
                console.log('Creating textured 3D face mesh...');
                
                if (this.faceModel) {
                    this.scene.remove(this.faceModel);
                    if (this.faceModel.geometry) this.faceModel.geometry.dispose();
                    if (this.faceModel.material) {
                        if (Array.isArray(this.faceModel.material)) {
                            this.faceModel.material.forEach((m) => m.dispose());
                        } else {
                            this.faceModel.material.dispose();
                        }
                    }
                    this.faceModel = null;
                }
                if (this.wireframe) {
                    this.scene.remove(this.wireframe);
                    if (this.wireframe.geometry) this.wireframe.geometry.dispose();
                    if (this.wireframe.material) this.wireframe.material.dispose();
                    this.wireframe = null;
                }
                this.faceTexture = null;
                if (this.testCube) {
                    this.scene.remove(this.testCube);
                    this.testCube = null;
                }
                
                const landmarks = this.faceResults.multiFaceLandmarks[0];
                const tri = this.triangulationIndices;
                if (!tri || tri.length < 9) {
                    console.error('Triangulation not loaded');
                    return;
                }
                
                const vw = this.video.videoWidth || 640;
                const vh = this.video.videoHeight || 480;
                const snap = document.createElement('canvas');
                snap.width = vw;
                snap.height = vh;
                const sctx = snap.getContext('2d');
                sctx.drawImage(this.video, 0, 0, vw, vh);
                
                this.faceTexture = new THREE.CanvasTexture(snap);
                this.faceTexture.needsUpdate = true;
                
                const geometry = new THREE.BufferGeometry();
                const n = landmarks.length;
                const positions = new Float32Array(n * 3);
                const uvs = new Float32Array(n * 2);
                
                for (let i = 0; i < n; i++) {
                    const lm = landmarks[i];
                    positions[i * 3] = (lm.x - 0.5) * 6;
                    positions[i * 3 + 1] = -(lm.y - 0.5) * 6;
                    positions[i * 3 + 2] = lm.z * 6;
                    uvs[i * 2] = lm.x;
                    uvs[i * 2 + 1] = lm.y;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
                geometry.setIndex(tri);
                geometry.computeVertexNormals();
                
                const material = new THREE.MeshPhongMaterial({
                    map: this.faceTexture,
                    side: THREE.DoubleSide,
                    shininess: 18,
                    specular: 0x222222,
                    transparent: true,
                    opacity: 0,
                });
                
                this.faceModel = new THREE.Mesh(geometry, material);
                this.faceModel.scale.set(0.1, 0.1, 0.1);
                
                this.scene.add(this.faceModel);
                
                const startTime = Date.now();
                const animateFaceAppearance = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / 1000, 1);
                    const easeProgress = 1 - Math.pow(1 - progress, 3);
                    
                    this.faceModel.scale.set(easeProgress, easeProgress, easeProgress);
                    this.faceModel.material.opacity = easeProgress * 0.98;
                    
                    if (progress < 1) {
                        requestAnimationFrame(animateFaceAppearance);
                    }
                };
                animateFaceAppearance();
                
                console.log('Textured face mesh:', tri.length / 3, 'triangles,', n, 'vertices');
                
                this.startFaceAnimation();
            }
            


            createBeepEffect() {
                document.querySelectorAll('.frame').forEach((el) => {
                    el.classList.add('frame-flash');
                    setTimeout(() => el.classList.remove('frame-flash'), 400);
                });
            }

            startFaceAnimation() {
                console.log('3D face model ready for user exploration');
            }
            
            reset() {
                if (this.faceModel && this.scene) {
                    this.scene.remove(this.faceModel);
                    if (this.faceModel.geometry) this.faceModel.geometry.dispose();
                    if (this.faceModel.material) {
                        if (this.faceModel.material.map) this.faceModel.material.map.dispose();
                        this.faceModel.material.dispose();
                    }
                    this.faceModel = null;
                }
                if (this.wireframe && this.scene) {
                    this.scene.remove(this.wireframe);
                    if (this.wireframe.geometry) this.wireframe.geometry.dispose();
                    if (this.wireframe.material) this.wireframe.material.dispose();
                    this.wireframe = null;
                }
                this.faceTexture = null;
                
                if (this.video.srcObject) {
                    this.video.srcObject.getTracks().forEach(track => track.stop());
                    this.video.srcObject = null;
                }
                
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.currentPositionIndex = 0;
                this.capturedImages = {};
                
                this.mainBtn.disabled = false;
                this.mainBtn.classList.remove('scanning', 'completed');
                this.mainBtn.textContent = 'Start camera';
                this.faceDetected.style.display = 'none';
                this.faceResults = null;
                this.isScanning = false;
                
                if (this.faceDetectedTimeout) {
                    clearTimeout(this.faceDetectedTimeout);
                }
                this.shouldUpdateCanvas = false;
                this.frameCount = 0;
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            new FaceScanner();
        });
    </script>
</body>
</html>
